name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BIN: otelcat

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use-cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build
        working-directory: ${{ github.workspace }}
        env:
          # cross overrides the default runner; keep flags explicit
          RUSTFLAGS: ""
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ env.BIN }} dist/${{ env.BIN }}-${{ matrix.target }}
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          tar -czf dist/${{ env.BIN }}-${{ matrix.target }}.tar.gz -C dist \
            ${{ env.BIN }}-${{ matrix.target }} README.md LICENSE-MIT LICENSE-APACHE
          rm dist/${{ env.BIN }}-${{ matrix.target }} dist/README.md dist/LICENSE-MIT dist/LICENSE-APACHE

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN }}.exe" "dist/${{ env.BIN }}-${{ matrix.target }}.exe"
          Compress-Archive -Path "dist/${{ env.BIN }}-${{ matrix.target }}.exe" -DestinationPath "dist/${{ env.BIN }}-${{ matrix.target }}.zip"
          Remove-Item "dist/${{ env.BIN }}-${{ matrix.target }}.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > ../checksums-sha256.txt && mv ../checksums-sha256.txt .
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
