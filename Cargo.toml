[package]
name = "otelcat"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "kcat for OpenTelemetry: receive, capture and replay OTLP on the command line"
license = "MIT OR Apache-2.0"
repository = "https://github.com/saromanov/otelcat"
homepage = "https://github.com/saromanov/otelcat"
readme = "README.md"
keywords = ["opentelemetry", "otel", "otlp", "tracing", "cli", "observability"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
anyhow = "1"
flate2 = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
opentelemetry-proto = { version = "0.33", features = ["gen-tonic", "trace", "logs", "metrics"] }
owo-colors = "4"
prost = "0.14"
hyper = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "fs", "io-util", "time"] }
tonic = { version = "0.14", features = ["gzip"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
